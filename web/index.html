      FIRST VIEWPORT: moldura fixa; trilho de 4 tarefas à esquerda, ativa invertida;
      caixa de comando no topo com cursor piscando; campo de exemplares abaixo, linha a
      linha. A ação primária nasce dentro da linha que o tombo acende.
      FORM: candidato 6 da lista ordenada; seed 295e0778, re-roll 1, registro bolder.
