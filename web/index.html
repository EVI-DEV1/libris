    <!--
      THESIS: A tela e o balcao: um campo de leitura de tombo domina o topo, e
      cada exemplar so oferece a acao que aceita agora. Recusa tanto o painel
      SaaS de cards e metricas quanto o retro pixelado da versao anterior, que
      o usuario recusou por ser velho e sem vida.
      OWN-WORLD: superficies brancas em camadas sobre campo frio (#f2f5fa),
      cobalto #2f57ff ocupando regiao inteira na acao primaria e no ativo do
      trilho, tres sinais com significado unico (ok, alerta, trava). Manrope
      para texto, JetBrains Mono so para codigo de tombo. Profundidade com
      deslocamento E desfoque; movimento com saida exponencial.
      STORY: o funcionario tem o livro na mao, le o tombo, e a tela diz o que
      da pra fazer — e, quando recusa, diz o motivo em portugues.
      FIRST VIEWPORT: trilho a esquerda com marca e quatro areas; titulo da
      tarefa; campo de tombo grande e monoespacado como peca principal; abaixo,
      o que esta fora da estante, linha a linha.
      FORM: direcao definida pelo usuario em palavras proprias (atual, com
      vida), que sobrepoe o sorteio anterior.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
