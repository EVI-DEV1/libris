    <meta charset="UTF-8" />

    <title>Libris</title>

  <body>
    <!--
      THESIS: a tela e o balcao. Um campo de leitura de tombo domina o topo e
      cada exemplar so oferece a acao que aceita agora. Recusa o painel SaaS de
      cards e metricas, e recusa o retro pixelado da versao anterior, que o
      usuario rejeitou como velho e sem vida.
      OWN-WORLD: gradiente Transfile do uiGradients (#16bffd -> #cb3066),
      referencia do usuario, ocupando REGIAO: o campo da pagina inteiro,
      diluido em 52% de branco; e as pecas de marca em versao forte
      (#0f7ea7 -> #cb3066), so a ponta ciano escurecida ate 4.60:1, porque a
      crua da 2.12:1 com branco. Cartas brancas em camadas flutuam sobre o
      campo. Tres sinais de significado unico: ok, alerta, trava. Manrope no
      texto, JetBrains Mono so em codigo de tombo. Profundidade com
      deslocamento E desfoque; movimento com saida exponencial.
      STORY: o funcionario tem o livro na mao, le o tombo, e a tela diz o que
      da pra fazer — e, quando recusa, diz o motivo em portugues.
      FIRST VIEWPORT: duas portas com endereco proprio (/ e /direcao). Depois
      de entrar: trilho a esquerda com marca e as areas do papel; titulo da
      tarefa; campo de tombo grande e monoespacado como peca principal; abaixo,
      o que esta fora da estante, linha a linha.
      FORM: direcao definida pelo usuario em palavras proprias (atual, com
      vida) mais a paleta que ele indicou, sobrepondo o sorteio anterior.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
